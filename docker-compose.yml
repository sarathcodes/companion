services:
  companion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: french-companion
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./ltm:/app/ltm
      - ./config.yml:/app/config.yml
